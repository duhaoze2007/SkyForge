<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyForge · 天际航线 — 亚洲大圆航线 3D 飞行</title>
<meta name="description" content="输入 ICAO/IATA 机场代码,观看飞机沿真实大圆航线飞越亚洲。码名对照,机外视角。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="stylesheet" href="/vendor/cesium/Widgets/widgets.css">
<link rel="stylesheet" href="/css/style.css">
<script>window.CESIUM_BASE_URL = '/vendor/cesium/';</script>
<script src="/vendor/cesium/Cesium.js"></script>
</head>
<body>

<div id="globe" aria-label="3D 地球"></div>

<!-- ══ 控制面板 ══ -->
<aside id="panel" class="glass">
  <div class="panel-head">
    <div class="logo">✈️ <b>SkyForge</b><span data-i18n="tagline">天际航线</span></div>
    <button id="langBtn" class="chip" title="切换语言">中 / EN</button>
  </div>

  <div class="field">
    <label for="origin" data-i18n="lblOrigin">起点机场</label>
    <div class="inrow">
      <input id="origin" list="apList" autocomplete="off" spellcheck="false" maxlength="4"
             placeholder="如 ZSPD / PVG" data-i18n-ph="phOrigin">
      <button class="qbtn" id="qOrigin" title="查询机场名称">🔍</button>
    </div>
    <div class="hint" id="hintOrigin"></div>
  </div>

  <div class="field">
    <label for="dest" data-i18n="lblDest">终点机场</label>
    <div class="inrow">
      <input id="dest" list="apList" autocomplete="off" spellcheck="false" maxlength="4"
             placeholder="如 VHHH / HKG" data-i18n-ph="phDest">
      <button class="qbtn" id="qDest" title="查询机场名称">🔍</button>
    </div>
    <div class="hint" id="hintDest"></div>
  </div>

  <div class="two-col">
    <div class="field">
      <label for="airline" data-i18n="lblAirline">航空公司</label>
      <input id="airline" list="alList" autocomplete="off" spellcheck="false" maxlength="24"
             placeholder="中国东方航空" data-i18n-ph="phAirline">
    </div>
    <div class="field">
      <label for="flight" data-i18n="lblFlight">航班号</label>
      <input id="flight" autocomplete="off" spellcheck="false" maxlength="8"
             placeholder="MU501" data-i18n-ph="phFlight">
    </div>
  </div>
  <datalist id="alList">
    <option value="中国东方航空"><option value="中国国际航空"><option value="中国南方航空">
    <option value="海南航空"><option value="厦门航空"><option value="国泰航空">
    <option value="新加坡航空"><option value="马来西亚航空"><option value="亚航">
    <option value="全日空"><option value="日本航空"><option value="大韩航空">
    <option value="韩亚航空"><option value="阿联酋航空"><option value="卡塔尔航空">
    <option value="长荣航空"><option value="中华航空"><option value="泰国航空">
  </datalist>

  <div class="btnrow">
    <button id="btnFly" class="primary" data-i18n="btnFly">🚀 起飞</button>
    <button id="btnRandom" class="ghost" data-i18n="btnRandom">🎲 随机航线</button>
  </div>

  <div class="seg" id="mapMode">
    <button class="on" data-mode="osm" data-i18n="mapBtn">🗺️ 地图</button>
    <button data-mode="sat" data-i18n="satBtn">🛰️ 卫星</button>
  </div>
  <div class="gpu-note" data-i18n="gpuNote">⚠️ 提示:本网站为实时 3D 渲染,较消耗 GPU 性能。低性能设备可能出现卡顿,建议使用高性能电脑访问。</div>
  <div class="hint small" id="panelNote">
    <span data-i18n="note1">💡 支持 ICAO 四字码 / IATA 三字码</span>
    <span data-i18n="note2">输入框失焦或点击 🔍 即时显示机场全称</span>
  </div>
</aside>

<datalist id="apList"></datalist>

<!-- ══ 底部飞行信息栏 ══ -->
<footer id="statusBar" class="glass hidden">
  <div class="flight-id" id="barTitle">✈️ —</div>
  <div class="meta" id="barMeta"></div>
  <div class="meter"><div id="barProg"></div></div>
  <div class="statrow">
    <span id="statSpeed">—</span>
    <span id="statAlt">—</span>
    <span id="statRemain">—</span>
    <span id="statEta">—</span>
  </div>
  <div class="ctrlrow">
    <button id="btnFollow" class="chip on" data-i18n="btnFollow">👁 跟随</button>
    <button id="btnOverview" class="chip" data-i18n="btnOverview">🌐 全览</button>
    <button id="btnPause" class="chip" data-i18n="btnPause">⏸ 暂停</button>
    <button id="btnStop" class="chip danger" data-i18n="btnStop" disabled>⏹ 停止</button>
    <span class="speed-group">
      <button class="chip spd on" data-spd="1">×1</button>
      <button class="chip spd" data-spd="2">×2</button>
      <button class="chip spd" data-spd="4">×4</button>
      <button class="chip spd" data-spd="8">×8</button>
      <button class="chip spd" data-spd="16">×16</button>
      <button class="chip spd" data-spd="32">×32</button>
    </span>
  </div>
</footer>

<div id="toasts"></div>

<!-- ══ 停止确认弹窗 ══ -->
<div id="modal" class="modal hidden">
  <div class="modal-box glass">
    <div class="modal-title" data-i18n="stopTitle">停止当前航班?</div>
    <div class="modal-body" data-i18n="stopBody">点击「停止」将清除当前航线并返回初始状态。</div>
    <div class="modal-btns">
      <button id="modalCancel" class="ghost" data-i18n="btnCancel">取消</button>
      <button id="modalOk" class="danger-btn" data-i18n="btnStop">⏹ 停止</button>
    </div>
  </div>
</div>

<div id="loader" class="hidden"><div class="spinner"></div><span data-i18n="loading">正在启动 3D 引擎…</span></div>

<script src="/js/app.js"></script>
</body>
</html>
